# Build the database from wago.tools, pre-render the site, publish it to GitHub Pages.
# Runs on every push to main, and on demand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The downloaded wago.tools tables (~20 MB) only change when config.py (the build numbers) changes.
      - name: Cache source data
        uses: actions/cache@v4
        with:
          path: |
            data/csv
            data/origins
            data/reference
            data/cache
          key: source-data-${{ hashFiles('spellbook/config.py', 'spellbook/flagdefs.py') }}

      - name: Build the database
        run: python3 build.py

      - name: Pre-render the static site
        run: python3 export.py --out dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
